<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGSA · Inventario CNC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>:root{
  /* Fondo — más claro que antes para mejor visibilidad en laptop */
  --bg:#1c2025;
  --panel:#252c33;
  --panel-raised:#2e363e;
  --panel-hover:#343d47;
  --border:#4a5460;
  --border-soft:#394148;

  /* Texto — más brillante para mejor contraste en pantallas con menor brillo */
  --text:#f0ede6;
  --text-dim:#b8c3cc;
  --text-faint:#8a96a0;

  /* Acento principal — ámbar más brillante */
  --amber:#f5b040;
  --amber-dim:#7a5520;

  /* Acento secundario — azul-verde más saturado */
  --teal:#45c8dd;
  --teal-dim:#1d6a78;

  /* Peligro */
  --danger:#f06860;
  --danger-dim:#6b2b28;

  /* Bueno */
  --good:#52cc88;
  --good-dim:#1e5c3a;

  --radius:4px;
  --mono:'JetBrains Mono',monospace;
  --display:'Oswald',sans-serif;
  --body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,0.045) 1px, transparent 0) 0 0/22px 22px,
    var(--bg);
  color:var(--text);
  font-family:var(--body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* -------- Topbar -------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;border-bottom:1px solid var(--border-soft);
  background:linear-gradient(180deg,#1e252d,#1a2028);
  flex-wrap:wrap;gap:10px;
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:38px;height:38px;border:2px solid var(--amber);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:17px;font-weight:700;color:var(--amber);
  flex-shrink:0;
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-title{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.3px;color:var(--text);}
.brand-sub{font-size:11.5px;color:var(--text-dim);}
.topnav{display:flex;gap:6px;flex-wrap:wrap;}
.navbtn{
  background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text-dim);
  padding:7px 13px;border-radius:var(--radius);font-size:13px;font-weight:500;transition:all .15s;
}
.navbtn:hover{background:var(--panel-hover);color:var(--text);border-color:var(--teal);}
.navbtn.active{background:var(--teal-dim);color:#d6f5fa;border-color:var(--teal);}

/* -------- Search bar -------- */
.searchbar{
  display:flex;align-items:center;gap:10px;padding:10px 20px;
  background:var(--panel);border-bottom:1px solid var(--border-soft);
}
.searchbar-icon{color:var(--text-dim);font-size:18px;flex-shrink:0;}
.searchbar input{
  flex:1;background:var(--panel-raised);border:1px solid var(--border);color:var(--text);
  padding:9px 12px;border-radius:var(--radius);font-size:14px;
  transition:border-color .15s;
}
.searchbar input::placeholder{color:var(--text-faint);}
.searchbar input:focus{outline:none;border-color:var(--teal);background:var(--panel-hover);}
.searchbar .icon-btn{width:34px;height:34px;flex-shrink:0;font-size:15px;}
@media(max-width:560px){.searchbar{padding:9px 14px;}}

/* -------- Breadcrumb -------- */
.breadcrumb{
  display:flex;align-items:center;gap:6px;padding:12px 20px 0;
  font-family:var(--mono);font-size:12.5px;color:var(--text-faint);flex-wrap:wrap;
}
.breadcrumb .crumb{color:var(--text-dim);cursor:pointer;}
.breadcrumb .crumb:hover{color:var(--teal);}
.breadcrumb .crumb.current{color:var(--amber);cursor:default;}
.breadcrumb .sep{color:var(--border);}

main{max-width:1080px;margin:0 auto;padding:16px 20px 60px;}

/* -------- Section header -------- */
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin:6px 0 16px;flex-wrap:wrap;
}
.section-title{font-family:var(--display);font-size:24px;font-weight:600;margin:0;color:var(--text);}
.section-meta{color:var(--text-dim);font-size:13px;font-family:var(--mono);}
.section-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* -------- Buttons -------- */
.btn{
  border:1px solid var(--border);background:var(--panel-raised);color:var(--text);
  padding:9px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;
  display:inline-flex;align-items:center;gap:7px;transition:all .15s;
}
.btn:hover{background:var(--panel-hover);border-color:var(--text-dim);}
.btn-primary{background:var(--amber);border-color:var(--amber);color:#1a0c00;font-weight:700;}
.btn-primary:hover{background:#f9c060;}
.btn-teal{background:var(--teal-dim);border-color:var(--teal);color:#c8f2f8;font-weight:600;}
.btn-teal:hover{background:#23788a;}
.btn-danger{background:transparent;border-color:var(--danger-dim);color:var(--danger);}
.btn-danger:hover{background:var(--danger-dim);color:#ffe8e7;}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* -------- Alert panel -------- */
.alert-panel{
  border:1px solid #7a3530;background:linear-gradient(180deg,#2c1a18,#231413);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:18px;
}
.alert-panel-head{display:flex;align-items:center;gap:8px;color:#f5807a;font-weight:600;font-size:14px;margin-bottom:8px;}
.alert-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:7px 0;border-top:1px solid rgba(255,255,255,0.06);font-size:13px;
}
.alert-row:first-child{border-top:none;}
.alert-row .name{color:var(--text);}
.alert-row .stat{font-family:var(--mono);color:var(--danger);font-size:12.5px;}

/* -------- Folder grid -------- */
.folder-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;
}
.folder-card{
  background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);
  padding:16px 14px;text-align:left;position:relative;transition:all .15s;
  display:flex;flex-direction:column;gap:8px;min-height:108px;
}
.folder-card:hover{
  border-color:var(--teal);background:var(--panel-raised);transform:translateY(-2px);
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
.folder-card .ficon{font-size:22px;}
.folder-card .fname{
  font-family:var(--display);font-size:15px;font-weight:500;line-height:1.25;color:var(--text);
}
.folder-card .fcount{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-top:auto;}
.folder-card .fcount b{color:var(--text);font-size:14px;}
.folder-card.low{border-color:#7a3530;}
.folder-card.low .fcount b{color:var(--danger);}
.folder-card .flag{
  position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;
  background:var(--danger);box-shadow:0 0 0 3px rgba(240,104,96,0.25);
}

/* -------- Category icon colors -------- */
.cat-cortadores .ficon{color:var(--teal);}
.cat-brocas .ficon{color:var(--amber);}
.cat-torno .ficon{color:#d4a060;}
.cat-fresadora .ficon{color:#90c0e8;}
.cat-refacciones .ficon{color:var(--text-dim);}
.cat-machuelos .ficon{color:#b088e0;}
.cat-boquillas .ficon{color:#78d0a8;}

/* -------- Item list -------- */
.item-list{display:flex;flex-direction:column;gap:8px;}
.item-row{
  background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);
  padding:13px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.item-row:hover{border-color:var(--border);background:var(--panel-raised);}
.item-main{flex:1 1 220px;min-width:0;}
.item-title{font-weight:600;font-size:14.5px;color:var(--text);line-height:1.3;}
.item-sub{font-size:12.5px;color:var(--text-dim);margin-top:3px;}
.item-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.tag{
  font-family:var(--mono);font-size:10.5px;color:var(--text-dim);
  border:1px solid var(--border);padding:2px 7px;border-radius:2px;
}

/* -------- Stat boxes (filo / long / cant) -------- */
.item-stats{display:flex;gap:20px;flex-wrap:wrap;padding:0 2px;}
.stat-box{display:flex;flex-direction:column;gap:3px;min-width:82px;}
.stat-box .sl{
  font-family:var(--mono);font-size:9.5px;color:var(--text-faint);
  text-transform:uppercase;letter-spacing:.06em;
}
.stat-box .sv{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--text);}
.stat-box .sv.qtybig{font-size:20px;color:var(--good);}
.stat-box .sv.qtybig.low{color:var(--danger);}

.item-actions{display:flex;gap:6px;}
.icon-btn{
  width:32px;height:32px;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--panel-raised);
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:15px;
  transition:all .15s;
}
.icon-btn:hover{color:var(--text);border-color:var(--text-dim);background:var(--panel-hover);}

/* -------- Agg strip -------- */
.agg-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.agg-chip{
  background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);
  padding:8px 14px;font-size:12px;color:var(--text-dim);
}
.agg-chip b{color:var(--teal);font-family:var(--mono);font-size:14px;margin-left:8px;}

/* -------- Modal -------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(8,10,12,0.78);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;
}
.modal{
  background:var(--panel-raised);border:1px solid var(--border);border-radius:6px;
  width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:22px;
}
.modal h3{font-family:var(--display);font-size:20px;margin:0 0 4px;font-weight:600;color:var(--text);}
.modal p.hint{color:var(--text-dim);font-size:12.5px;margin:0 0 16px;line-height:1.5;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;font-weight:500;color:var(--text-dim);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:9px 11px;border-radius:var(--radius);font-size:14px;transition:border-color .15s;
}
.field input::placeholder,.field textarea::placeholder{color:var(--text-faint);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-soft);}

/* -------- Tipo picker (Bola / Plano) -------- */
.tipo-picker{display:flex;gap:10px;margin-bottom:14px;}
.tipo-opt{
  flex:1;padding:12px 10px;border-radius:var(--radius);border:2px solid var(--border);
  background:var(--panel);color:var(--text-dim);font-size:14px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;
}
.tipo-opt .tipo-icon{font-size:18px;}
.tipo-opt.active{border-color:var(--teal);background:var(--teal-dim);color:#c8f4f9;}
.tipo-opt:hover:not(.active){border-color:var(--border);background:var(--panel-raised);color:var(--text);}

/* -------- Medida tabs -------- */
.medida-tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:4px;}
.medida-tab{
  flex:1;padding:8px 10px;border:none;background:var(--panel);color:var(--text-dim);
  font-size:13px;font-weight:500;transition:all .15s;
}
.medida-tab.active{background:var(--panel-raised);color:var(--text);}
.medida-tab:hover:not(.active){color:var(--text);}

/* -------- Conversion box y name preview -------- */
.conversion-box{
  background:rgba(69,200,221,0.08);border:1px solid var(--teal-dim);
  border-radius:var(--radius);padding:8px 12px;font-size:13px;color:var(--text-dim);
  margin-top:8px;
}
.conv-label{color:var(--text-faint);font-size:11px;margin-right:6px;}
.conversion-box strong{color:var(--teal);font-family:var(--mono);}
.name-preview{
  background:rgba(245,176,64,0.09);border:1px solid var(--amber-dim);
  border-radius:var(--radius);padding:8px 12px;font-size:13px;color:var(--text-dim);
  margin-bottom:4px;
}
.pv-label{color:var(--text-faint);font-size:11px;margin-right:6px;}
.name-preview strong{color:var(--amber);font-family:var(--mono);}

/* -------- Table -------- */
.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table th{
  text-align:left;font-family:var(--mono);font-size:10.5px;
  color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;
  padding:9px 10px;border-bottom:2px solid var(--border);
}
.data-table td{padding:9px 10px;border-bottom:1px solid var(--border-soft);color:var(--text);}
.data-table tr:hover td{background:rgba(255,255,255,0.03);}
.mono{font-family:var(--mono);}

/* -------- Empty state -------- */
.empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty-state .ei{font-size:36px;margin-bottom:12px;color:var(--text-faint);}
.empty-state p{margin:4px 0;font-size:14px;}

/* -------- Settings -------- */
.settings-group{margin-bottom:28px;}
.settings-group h4{font-family:var(--display);font-size:16px;margin:0 0 10px;color:var(--amber);font-weight:500;}
.settings-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 14px;background:var(--panel);border:1px solid var(--border-soft);
  border-radius:var(--radius);margin-bottom:6px;
}
.settings-row .srname{font-size:13.5px;color:var(--text);}
.settings-row .srstat{font-family:var(--mono);font-size:12px;color:var(--text-dim);}
.settings-row input{
  width:72px;background:var(--panel-raised);border:1px solid var(--border);color:var(--text);
  padding:6px 8px;border-radius:var(--radius);font-family:var(--mono);font-size:14px;text-align:center;
}

/* -------- Toast -------- */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--panel-raised);border:1px solid var(--teal);color:var(--text);
  padding:11px 20px;border-radius:var(--radius);font-size:13px;opacity:0;pointer-events:none;
  transition:all .25s;z-index:200;box-shadow:0 8px 28px rgba(0,0,0,0.5);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{border-color:var(--danger);}

/* -------- Import zone -------- */
.drop-zone{
  border:1.5px dashed var(--border);border-radius:var(--radius);padding:24px 16px;
  text-align:center;color:var(--text-dim);font-size:13px;margin-bottom:10px;
}
.drop-zone b{color:var(--teal);}
.drop-zone input{color:var(--text-dim);}

@media(max-width:560px){
  .topbar{padding:11px 14px;}
  main{padding:14px 14px 50px;}
  .section-title{font-size:20px;}
  .stat-box .sv.qtybig{font-size:17px;}
}

/* ---- Home groups ---- */
.home-group{margin-bottom:24px;}
.home-group-label{
  font-family:var(--mono);font-size:10.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;color:var(--text-faint);margin-bottom:10px;padding-bottom:5px;
  border-bottom:1px solid var(--border-soft);
}

/* ---- Vida útil ---- */
.vu-bar-wrap{display:flex;align-items:center;gap:10px;margin-top:6px;}
.vu-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;max-width:140px;}
.vu-fill{height:100%;border-radius:3px;transition:width .3s;}
.vu-fill.vu-ok{background:var(--good);}
.vu-fill.vu-warn{background:var(--amber);}
.vu-fill.vu-crit{background:var(--danger);}
.vu-label{font-family:var(--mono);font-size:11px;}
.vu-label.vu-ok{color:var(--good);}
.vu-label.vu-warn{color:var(--amber);}
.vu-label.vu-crit{color:var(--danger);}
.vu-crit{color:var(--danger);}
.vu-slider-wrap{display:flex;align-items:center;gap:12px;}
.vu-slider-wrap input[type=range]{flex:1;accent-color:var(--teal);}
.vu-pct-display{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--teal);min-width:46px;}

/* ---- Item low highlight ---- */
.item-low{border-color:var(--danger-dim)!important;}
.field-row .fw{flex:1;min-width:0;}
.ins-sub{margin:10px 0 0 18px;padding-left:14px;border-left:2px solid var(--teal-dim);}
.ins-main.open{border-color:var(--teal);background:var(--panel-raised);}
.ins-caret{color:var(--teal);font-size:12px;margin-left:4px;}
.otro-input{margin-top:8px;}
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">A</div>
    <div class="brand-text">
      <span class="brand-title">AGSA · Inventario CNC</span>
      <span class="brand-sub">Herramientas y consumibles — Producción CNC</span>
    </div>
  </div>
  <nav class="topnav">
    <button class="navbtn" data-nav="home">Inicio</button>
    <button class="navbtn" data-nav="almacen">En Almacén</button>
    <button class="navbtn" data-nav="alertas">Alertas</button>
    <button class="navbtn" data-nav="settings">Ajustes</button>
    <button class="navbtn" data-nav="bajas">Bajas</button>
    <button class="navbtn" data-nav="equivalencias">Equivalencias</button>
  </nav>
</header>

<div class="searchbar">
  <span class="searchbar-icon">⌕</span>
  <input id="globalSearch" placeholder='Buscar por medida (1/4, 1/8, 5 mm...) o nombre' oninput="onGlobalSearch()" autocomplete="off">
  <button id="searchClearBtn" class="icon-btn" style="display:none;" onclick="clearGlobalSearch()" title="Limpiar búsqueda">✕</button>
</div>

<div id="breadcrumb" class="breadcrumb"></div>

<main id="app"></main>

<div id="modalRoot"></div>

<script>/* =========================================================================
   DEFINICIÓN COMPLETA DE CATEGORÍAS — AGSA
   ========================================================================= */

// Cada categoría puede tener:
//   icon: emoji
//   grupo: para agrupar en el home
//   sizeGrouped: true -> carpetas por medida
//   tipoGrouped: true -> carpetas por tipo antes de medida (solo cortadores)
//   tipos: lista fija de tipos si aplica (para modal agregar)
//   vidaUtil: true -> tiene campo de vida útil (%)
//   noMedida: true -> no se agrupa por medida, lista directa
//   addFields: [] -> campos extra en el formulario
//   Note: si no tiene sizeGrouped ni tipoGrouped -> lista directa

const CATEGORIAS = {
  // -------- HERRAMIENTA DE CORTE --------
  cortadores: {
    label:'Cortadores', icon:'⟡', grupo:'Herramienta de corte',
    sizeGrouped:true, tipoGrouped:true,
    tipos:['Bola','Plano'],
    vidaUtil:true,
    addFields:['filo','longitud','empaque']
  },
  avellanadores: {
    label:'Avellanadores', icon:'◎', grupo:'Herramienta de corte',
    sizeGrouped:true, vidaUtil:true,
    addFields:['filo','longitud','empaque']
  },
  brocas: {
    label:'Brocas', icon:'⟠', grupo:'Herramienta de corte',
    sizeGrouped:true, vidaUtil:true,
    addFields:['longitud','empaque']
  },
  machuelos: {
    label:'Machuelos y tarajas', icon:'✕', grupo:'Herramienta de corte',
    sizeGrouped:true, vidaUtil:true,
    addFields:['paso','longitud','empaque'],
    extraFields:[{id:'paso', label:'Paso (mm/hilos)', placeholder:'Ej. 1.25 ó 20TPI'}]
  },
  puntas_grabado: {
    label:'Puntas de grabado', icon:'✦', grupo:'Herramienta de corte',
    sizeGrouped:true, vidaUtil:true,
    addFields:['angulo','longitud','empaque'],
    extraFields:[{id:'angulo', label:'Ángulo (°)', placeholder:'Ej. 30, 45, 60'}]
  },
  cuchillas_tronzado: {
    label:'Cuchillas de tronzado', icon:'▬', grupo:'Herramienta de corte',
    sizeGrouped:true, vidaUtil:true,
    addFields:['longitud','empaque']
  },

const CAT_ORDER = Object.keys(CATEGORIAS);

// Busca una categoría por clave, etiqueta actual o etiqueta anterior (alias)
function findCatKey(txt){
  const t=String(txt==null?'':txt).toLowerCase().trim(); if(!t) return null;
  const e=Object.entries(CATEGORIAS).find(([k,v])=>k===t||v.label.toLowerCase()===t||(v.alias||[]).some(a=>a.toLowerCase()===t));
  return e?e[0]:null;
}

async function storeGet(key, fallback){
  try{ const r=await window.storage.get(key,false); return r&&r.value!==undefined?JSON.parse(r.value):fallback; }
  catch(e){ return fallback; }
}
async function storeSet(key,val){
  try{ await window.storage.set(key,JSON.stringify(val),false); return true; }
  catch(e){ console.error('storage',e); return false; }
}
async function loadAll(){
  INVENTARIO = await storeGet('inventario3', null);
  if(!INVENTARIO){ INVENTARIO = migrateSeed(SEED_DATA); await storeSet('inventario3', INVENTARIO); }
  else {
    const before=JSON.stringify(INVENTARIO);
    INVENTARIO = INVENTARIO.map(limpiarItem);
    if(JSON.stringify(INVENTARIO)!==before) await storeSet('inventario3', INVENTARIO);
  }
  BAJAS    = await storeGet('bajas', []);
  BAJAS.forEach(b=>{ delete b.modelo; if(b.categoria==='tornillos_insertos') b.categoria='refacciones'; });
  MINIMOS  = await storeGet('minimos', {});
}
function migrateSeed(data){
  return data.map(it=>{
    if(!CATEGORIAS[it.categoria] && it.categoria){
      const k = findCatKey(it.categoria);
      if(k) it.categoria = k;
    }
    if(!it.id) it.id = genId('itm');
    limpiarItem(it);
    if(it.vidaUtil==null && it.categoria && CATEGORIAS[it.categoria] && CATEGORIAS[it.categoria].vidaUtil) it.vidaUtil = 100;
    return it;
  });
}
/* Quita Marca/Modelo conservando la medida y el código que estaban dentro de "modelo" */
function limpiarItem(it){
  if(it.categoria==='insertos') it.categoria='fresadora';
  // Tornillos ahora viven en Refacciones / Tornillería
  if(it.categoria==='tornillos_insertos') it.categoria='refacciones';
  if(it.tipoTornillo){
    const mt={'Para inserto':'Tornillo para inserto','Para piña':'Tornillo para piña','Para kyocera':'Tornillo para kyocera','Para corona':'Tornillo para corona'};
    it.tipoRefaccion=mt[it.tipoTornillo]||it.tipoTornillo; delete it.tipoTornillo;
  }
  if(it.tipoPresna==='Chuck') it.tipoPresna='Chuck / Plato de sujeción';
  if(it.tipoDesarmador==='Phillips') it.tipoDesarmador='Cruz (Phillips)';
  if(it.tipoDesarmador==='Hexagonal') it.tipoDesarmador='Hexagonal (Allen)';
  const mo=String(it.modelo||'');
  if(mo){
    const md=getMedida(it);
    const mm=mo.match(/\d+\/\d+"?|\d+(?:\.\d+)?\s*mm/i);
    if(!(md&&md.display)&&mm) it.diametro=parseMedida(mm[0]);
    if(!it.codigo&&(it.categoria==='fresadora'||it.categoria==='torno')) it.codigo=mo;
    if(it.categoria==='cortadores'&&!it.tipoHerramienta&&/bola/i.test(mo)) it.tipoHerramienta='Bola';
  }
  delete it.marca; delete it.modelo; delete it.marca_maquina;
  return it;
}

/* =========================================================================
   HELPERS DE MEDIDA / NOMBRE
   ========================================================================= */
function getMedida(it){ return it.diametro||it.medida||null; }
function deriveSizeLabel(it){
  const med=getMedida(it);
  if(med&&med.display&&med.display.trim()) return med.display.trim();
  const text=(it.articulo||'').trim();
  let m=text.match(/(\d+\/\d+)\s*"?/);
  if(m) return m[1]+'"';
  m=text.match(/(\d+(?:\.\d+)?)\s*mm/i);
  if(m) return m[1]+' mm';
  return 'Sin medida';
}
function deriveSizeSort(it){
  const med=getMedida(it);
  if(med&&typeof med.decimal==='number'&&med.decimal!==null) return med.decimal;
  const d=parseMedida(deriveSizeLabel(it)).decimal;
  return d!=null?d:9999;
}
function mmFromLabel(label){
  const p=parseMedida(label||''); return p.mm;
}
function deriveMM(it){
  const med=getMedida(it);
  if(med&&typeof med.mm==='number'&&med.mm!==null) return +med.mm.toFixed(3);
  return mmFromLabel(deriveSizeLabel(it));
}
function formatSizeLabel(label){
  if(!label||label==='Sin medida') return label;
  if(/\d+\/\d+/.test(label)||/^\d*\.?\d+\s*"$/.test(label)){
    const mm=mmFromLabel(label);
    return mm!==null?`${label} (${mm} mm)`:label;
  }
  return label;
}
function deriveTipo(it){
  if(it.tipoHerramienta) return it.tipoHerramienta;
  const text=((it.articulo||'')+' '+(it.notas||'')).toLowerCase();
  if(it.categoria==='cortadores'){
    return text.includes('bola')?'Bola':'Plano';
  }
  return null;
}
function sumCantidad(arr){ return arr.reduce((s,i)=>s+(Number(i.cantidad)||0),0); }
function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function catCfg(cat){ return CATEGORIAS[cat]||{label:cat,icon:'▢',grupo:'Otros',sizeGrouped:false,addFields:[]}; }
function isSizeGrouped(cat){ return !!catCfg(cat).sizeGrouped; }
function isTipoGrouped(cat){ return !!catCfg(cat).tipoGrouped; }
function hasVidaUtil(cat){ return true; } // Vida útil (%) disponible en todos los ítems

function groupKey(categoria,tipo,sizeLabel){ return [categoria,tipo||'',sizeLabel].join('::'); }

function renderBreadcrumb(){
  const el=document.getElementById('breadcrumb');

    el.innerHTML=`<span class="crumb" onclick="clearGlobalSearch()">Inicio</span><span class="sep">›</span><span class="crumb current">Buscando: "${escHtml(state.searchQuery)}"</span>`;
    return;
  }
  const STATIC={almacen:'En Almacén',settings:'Ajustes',bajas:'Bajas',equivalencias:'Equivalencias',alertas:'Alertas'};
  if(STATIC[state.view]){ el.innerHTML=crumbHtml([{label:'Inicio',i:0},{label:STATIC[state.view],cur:true}]); return; }
  if(state.view==='home'){ el.innerHTML=''; return; }
  const trail=[{label:'Inicio',i:0}];
  if(state.categoria) trail.push({label:catCfg(state.categoria).label,i:1,cur:state.view==='categoria'});
  if(state.tipo) trail.push({label:state.tipo,i:2,cur:state.view==='tipo'});
  if(state.sizeKey) trail.push({label:formatSizeLabel(state.sizeKey),i:3,cur:state.view==='size'});
  el.innerHTML=crumbHtml(trail);
}
function crumbHtml(trail){
  return trail.map((t,idx)=>{
    const sep=idx>0?'<span class="sep">›</span>':'';
    const cls=t.cur?'crumb current':'crumb';
    const attr=t.cur?'':`onclick="__cn(${t.i})"`;
    return sep+`<span class="${cls}" ${attr}>${escHtml(t.label)}</span>`;
  }).join('');
}
function __cn(i){
  if(i===0){goHome();return;}
  if(i===1&&state.categoria){goCategoria(state.categoria);return;}
  if(i===2&&state.tipo){goTipo(state.tipo);return;}
}

/* =========================================================================
   ALERTAS DE STOCK
   ========================================================================= */
function computeGroupTotals(){
  const groups={};
  INVENTARIO.forEach(it=>{
    if(!isSizeGrouped(it.categoria)) return;
    const label=deriveSizeLabel(it);
    const tipo=isTipoGrouped(it.categoria)?deriveTipo(it):null;
    const key=groupKey(it.categoria,tipo,label);
    if(!groups[key]) groups[key]={categoria:it.categoria,tipo,sizeLabel:label,total:0,key};
    groups[key].total+=Number(it.cantidad)||0;
  });
  Object.values(groups).forEach(g=>{ g.min=MINIMOS[g.key]??null; });
  return groups;
}
function lowStockGroups(){ return Object.values(computeGroupTotals()).filter(g=>g.min!==null&&g.total<g.min); }
function lowVidaUtil(){ return INVENTARIO.filter(it=>hasVidaUtil(it.categoria)&&it.vidaUtil!==undefined&&it.vidaUtil!==null&&it.vidaUtil<=20); }

/* =========================================================================
   HOME — agrupado por grupo de categorías
   ========================================================================= */
function renderHome(){
  const low=lowStockGroups();
  const lowVU=lowVidaUtil();
  let alertHtml='';
  if(low.length||lowVU.length){

  const totalPiezas=sumCantidad(INVENTARIO);
  const gruposHtml=GRUPO_ORDER.map(grupoName=>{
    const cats=grupos[grupoName]||[];
    if(grupoName==='Insertos'){
      const all=INVENTARIO.filter(i=>cats.includes(i.categoria)); const open=!!state.insOpen;
      const sub=cats.map(cat=>{ const it2=INVENTARIO.filter(i=>i.categoria===cat);
        return `<button class="folder-card cat-${cat}" onclick="goCategoria('${cat}')">
          <span class="ficon">📄</span><span class="fname">${escHtml(catCfg(cat).label)}</span>
          <span class="fcount"><b>${sumCantidad(it2)}</b> pzas · ${it2.length} ref.</span></button>`; }).join('');
      return `<div class="home-group"><div class="folder-grid">
        <button class="folder-card ins-main ${open?'open':''}" onclick="toggleInsertos()">
          <span class="ficon">◆</span><span class="fname">Insertos <span class="ins-caret">${open?'▴':'▾'}</span></span>
          <span class="fcount"><b>${sumCantidad(all)}</b> pzas · ${all.length} ref.</span></button></div>
        ${open?`<div class="ins-sub folder-grid">${sub}</div>`:''}</div>`;
    }
    const cards=cats.map(cat=>{
      if(cat==='mordazas_torno') return '';
      if(cat==='mordazas_fresadora') return mordazasCard(low,lowVU);
      const items=INVENTARIO.filter(i=>i.categoria===cat);
      const total=sumCantidad(items);
      const cfg=catCfg(cat);
      const lowCount=low.filter(g=>g.categoria===cat).length;
      const lowVUCount=lowVU.filter(i=>i.categoria===cat).length;
      return `<button class="folder-card cat-${cat} ${lowCount||lowVUCount?'low':''}" onclick="goCategoria('${cat}')">
        ${(lowCount||lowVUCount)?'<span class="flag"></span>':''}
        <span class="ficon">${cfg.icon||'▢'}</span>
        <span class="fname">${escHtml(cfg.label)}</span>
        <span class="fcount"><b>${total}</b> pzas · ${items.length} ref.</span>
      </button>`;
    }).join('');
    return `<div class="home-group">
      <div class="home-group-label">${escHtml(grupoName)}</div>
      <div class="folder-grid">${cards}</div>
      ${grupoName==='Mordazas y prensas'&&state.mordOpen?mordazasSub():''}
    </div>`;
  }).join('');

  return `<div class="section-head">
      <h2 class="section-title">Inventario AGSA</h2>
      <span class="section-meta">${INVENTARIO.length} referencias · ${totalPiezas} piezas</span>
    </div>
    ${alertHtml}
    ${gruposHtml}
    <div class="section-head" style="margin-top:26px;">
      <h3 class="section-title" style="font-size:18px;">Documentos</h3>

        <button class="btn" onclick="openImportModal()">Importar Excel</button>
        <button class="btn btn-teal" onclick="openExportModal('inventario')">⬇ Inventario</button>
        <button class="btn btn-teal" onclick="openExportModal('bajas')">⬇ Bajas</button>
      </div>
    </div>`;
}

function renderCategoria(){
  const cat=state.categoria; const cfg=catCfg(cat);
  const items=INVENTARIO.filter(i=>i.categoria===cat);
  const head=`<div class="section-head">
    <h2 class="section-title">${cfg.icon} ${escHtml(cfg.label)}</h2>
    <span class="section-meta">${sumCantidad(items)} pzas · ${items.length} ref.</span>
  </div>`;
  const addBtn=`<div class="section-actions" style="margin-bottom:14px;">
    <button class="btn" onclick="openAddItemModal('${cat}')">+ Agregar a ${escHtml(cfg.label)}</button>
  </div>`;
  if(!items.length) return head+addBtn+emptyState('Sin herramientas aquí todavía.');

  if(isTipoGrouped(cat)){
    const tipos={};
    items.forEach(it=>{ const t=deriveTipo(it)||'Otro'; (tipos[t]=tipos[t]||[]).push(it); });
    const TIPO_ICONS={'Bola':'●','Plano':'▬','Plana':'▬'};
    const cards=Object.entries(tipos).map(([t,arr])=>`
      <button class="folder-card" onclick="goTipo('${escAttr(t)}')">
        <span class="ficon" style="color:var(--teal)">${TIPO_ICONS[t]||'◇'}</span>
        <span class="fname">${escHtml(t)}</span>
        <span class="fcount"><b>${sumCantidad(arr)}</b> pzas · ${arr.length} ref.</span>
      </button>`).join('');
    return head+addBtn+`<div class="folder-grid">${cards}</div>`;
  }
  if(isSizeGrouped(cat)){
    return head+addBtn+renderSizeFolders(items,cat,null);
  }
  return head+addBtn+renderItemList(items);
}

function renderTipo(){
  const cat=state.categoria; const tipo=state.tipo; const cfg=catCfg(cat);
  const items=INVENTARIO.filter(i=>i.categoria===cat&&deriveTipo(i)===tipo);
  const head=`<div class="section-head">
    <h2 class="section-title">${cfg.icon} ${escHtml(cfg.label)} · ${escHtml(tipo)}</h2>
    <span class="section-meta">${sumCantidad(items)} pzas · ${items.length} ref.</span>
  </div>`;
  if(isSizeGrouped(cat)) return head+renderSizeFolders(items,cat,tipo);
  return head+renderItemList(items);
}

function renderSizeFolders(items,cat,tipo){
  const low=lowStockGroups().filter(g=>g.categoria===cat&&(tipo===null||g.tipo===tipo)).map(g=>g.sizeLabel);
  const groups={};
  items.forEach(it=>{
    const l=deriveSizeLabel(it);
    (groups[l]=groups[l]||{label:l,sortVal:deriveSizeSort(it),items:[]}).items.push(it);
  });
  const cards=Object.values(groups).sort((a,b)=>a.sortVal-b.sortVal).map(g=>{
    const t=sumCantidad(g.items); const isLow=low.includes(g.label);
    return `<button class="folder-card ${isLow?'low':''}" onclick="goSize('${escAttr(g.label)}')">
      ${isLow?'<span class="flag"></span>':''}
      <span class="ficon">◆</span>
      <span class="fname">${escHtml(formatSizeLabel(g.label))}</span>
      <span class="fcount"><b>${t}</b> pzas · ${g.items.length} ref.</span>
    </button>`;
  }).join('');
  return `<div class="folder-grid">${cards}</div>`;
}

function renderSize(){
  const cat=state.categoria; const tipo=state.tipo; const cfg=catCfg(cat);
  let items=INVENTARIO.filter(i=>i.categoria===cat&&deriveSizeLabel(i)===state.sizeKey);
  if(tipo) items=items.filter(i=>deriveTipo(i)===tipo);
  const key=groupKey(cat,isTipoGrouped(cat)?tipo:null,state.sizeKey);
  const min=MINIMOS[key];
  const total=sumCantidad(items);
  const titleTipo=tipo?' · '+tipo:'';
  const head=`<div class="section-head">
    <h2 class="section-title">${escHtml(cfg.label+titleTipo+' · '+formatSizeLabel(state.sizeKey))}</h2>
    <span class="section-meta">${total} pzas${min!=null?' · mín. '+min:''}</span>
  </div>`;
  return head+renderItemList(items);
}

function emptyState(msg){ return `<div class="empty-state"><div class="ei">▢</div><p>${escHtml(msg)}</p></div>`; }

function vidaUtilBadge(vu){
  if(vu===undefined||vu===null) return '';
  const pct=Number(vu);
  let cls='vu-ok'; if(pct<=20) cls='vu-crit'; else if(pct<=50) cls='vu-warn';
  const used=100-pct;
  return `<div class="vu-bar-wrap" title="Vida útil: ${pct}%">
    <div class="vu-bar"><div class="vu-fill ${cls}" style="width:${pct}%"></div></div>
    <span class="vu-label ${cls}">${pct}% vida útil</span>
  </div>`;
}

function detallesItem(it){
  const d=[];
  if(it.codigo) d.push(it.codigo);
  if(it.grado) d.push('Grado '+it.grado);
  if(it.materialTrabajo) d.push(it.materialTrabajo);
  if(it.tipoMachuelo) d.push(it.tipoMachuelo);
  if(it.tipoPerfil) d.push(it.tipoPerfil);
  if(it.angulo) d.push('Ángulo: '+String(it.angulo).replace(/°/g,'')+'°');
  if(it.diametroZanco) d.push('Zanco: '+it.diametroZanco+' mm');
  if(it.numFilos) d.push('Filos: '+it.numFilos);
  if(it.tipoMaquina) d.push(it.tipoMaquina);
  if(it.husillo) d.push(it.husillo);
  if(it.ejes) d.push(it.ejes);
  if(it.unidad) d.push(it.unidad);
  [it.paso&&'Paso: '+it.paso,it.tipoBoquilla,it.tipoCono,it.tipoInserto,it.tipoDesarmador,it.tipoLima,it.tipoTornillo,
   it.tipoPresna,it.nSerie&&'S/N: '+it.nSerie,it.alcance&&'Alcance: '+it.alcance+' mm',it.resolucion&&'Res. '+it.resolucion+' mm',
   it.capMem||it.capacidad,it.espesor&&'Esp. '+it.espesor,
   it.tipoLlave,it.tipoMordaza,it.tipoPerica,it.tipoRefaccion,
   it.descripcion&&'Desc.: '+it.descripcion,it.alcanceFlex&&'Alcance: '+it.alcanceFlex+' m'].forEach(e=>{ if(e) d.push(e); });
  return d;
}
function esAlmacen(it){ return String(it.ubicacion||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().startsWith('almacen'); }
function renderAlmacen(){
  const items=INVENTARIO.filter(esAlmacen);
  const cats=[...new Set(items.map(i=>i.categoria))].sort((x,y)=>catCfg(x).label.localeCompare(catCfg(y).label,'es'));
  const head=`<div class="section-head"><h2 class="section-title">📦 En Almacén</h2>
    <span class="section-meta">${items.length} referencias · ${sumCantidad(items)} pzas</span></div>`;
  if(!items.length) return head+emptyState('No hay ítems con ubicación "Almacén". Asigna la ubicación al agregar o editar una herramienta.');
  return head+cats.map(c=>{ const arr=items.filter(i=>i.categoria===c);
    return `<div class="settings-group"><h4>${escHtml(catCfg(c).icon+' '+catCfg(c).label)} · ${sumCantidad(arr)} pzas</h4>${renderItemList(arr)}</div>`; }).join('');
}
function renderItemList(items){
  if(!items.length) return emptyState('Sin referencias aquí todavía.');
  const lowSet=new Set(lowStockGroups().map(g=>g.key));
  return `<div class="item-list">${items.map(it=>{
    const cfg=catCfg(it.categoria);
    const tipoGroup=isTipoGrouped(it.categoria)?deriveTipo(it):null;
    const gKey=groupKey(it.categoria,tipoGroup,deriveSizeLabel(it));
    const isLow=lowSet.has(gKey);
    const subParts=detallesItem(it);
    if(it.piezasEmpaque) subParts.push(cfg.empLabel?cfg.empLabel+': '+it.piezasEmpaque+' pz':'Emp: '+it.piezasEmpaque);
    if(it.categoria==='limas_joyero'&&it.piezasEmpaque!=null&&it.piezasEmpaque!==''){
      const fal=Number(it.piezasEmpaque)-(Number(it.cantidad)||0);
      subParts.push(fal>0?fal+' pz faltantes':'Paquete completo');
    }
    if(it.categoria==='puntas_indicador'){
      const _m=deriveSizeLabel(it);
      if(_m!=='Sin medida'&&!String(it.articulo||'').includes(_m)) subParts.unshift('Medida: '+formatSizeLabel(_m));
    }
    if(it.ubicacion) subParts.push('📍 '+it.ubicacion);

    return `<div class="item-row ${isLow?'item-low':''}">
      <div class="item-main">
        <div class="item-title">${escHtml(it.articulo||cfg.label)}</div>
        ${subParts.length?`<div class="item-sub">${escHtml(subParts.join(' · '))}</div>`:''}
        ${hasVidaUtil(it.categoria)&&it.vidaUtil!=null?vidaUtilBadge(it.vidaUtil):''}
      </div>
      <div class="item-stats">
        ${it.largoFilo!=null?`<div class="stat-box"><span class="sl">Largo filo</span><span class="sv">${it.largoFilo} mm</span></div>`:''}
        ${it.longitudTotal!=null?`<div class="stat-box"><span class="sl">Longitud</span><span class="sv">${it.longitudTotal} mm</span></div>`:''}
        <div class="stat-box"><span class="sl">${it.unidad?escHtml(it.unidad)+' en existencia':(cfg.qtyLabel||'Pz existencia')}</span><span class="sv qtybig${isLow?' low':''}">${it.cantidad??0}</span></div>
      </div>
      <div class="item-actions">
        <button class="icon-btn" title="Editar" onclick="openEditModal('${it.id}')">✎</button>
        <button class="icon-btn" title="Dar de baja" onclick="openBajaModal('${it.id}')">−</button>
        <button class="icon-btn" title="Eliminar" onclick="openDeleteModal('${it.id}')">✕</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

/* -------- Dar de baja -------- */
function openBajaModal(id){
  const it=INVENTARIO.find(i=>i.id===id); if(!it) return;
  openModal(`<div class="modal">
    <h3>Dar de baja</h3>
    <p class="hint">${escHtml(it.articulo||'')} · Disponible: ${it.cantidad}</p>
    <div class="field"><label>Cantidad a dar de baja</label><input type="number" id="bajaQty" value="1" min="1" max="${it.cantidad}"></div>
    <div class="field"><label>Motivo</label>
      <select id="bajaMotivo">
        <option>Consumida / desgastada</option><option>Rota / dañada</option>
        <option>Extraviada</option><option>Enviada a otra área</option><option>Otro</option>
      </select></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="submitBaja('${id}')">Dar de baja</button>
    </div></div>`);
}
async function submitBaja(id){
  const it=INVENTARIO.find(i=>i.id===id);
  const qty=Number(document.getElementById('bajaQty').value);
  const mot=document.getElementById('bajaMotivo').value;
  if(isNaN(qty)||qty<1||qty>it.cantidad){ toast('Cantidad inválida',true); return; }
  it.cantidad-=qty;
  BAJAS.push({id:genId('b'),fecha:new Date().toISOString(),categoria:it.categoria,
    articulo:it.articulo||'',medida:deriveSizeLabel(it),cantidad:qty,motivo:mot});
  await persistInv(); await persistBajas(); closeModal(); render(); toast('Baja registrada');
}
window.openBajaModal=openBajaModal; window.submitBaja=submitBaja;

/* -------- Eliminar -------- */
function openDeleteModal(id){
  const it=INVENTARIO.find(i=>i.id===id); if(!it) return;
  openModal(`<div class="modal">
    <h3>Eliminar referencia</h3>
    <p class="hint">¿Seguro que deseas eliminar "${escHtml(it.articulo||'')}? Esto la quitará completamente del inventario.</p>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="submitDelete('${id}')">Eliminar</button>
    </div></div>`);
}
async function submitDelete(id){
  const idx=INVENTARIO.findIndex(i=>i.id===id); if(idx===-1) return;
  const it=INVENTARIO[idx];
  if((it.cantidad??0)>0){
    BAJAS.push({id:genId('b'),fecha:new Date().toISOString(),categoria:it.categoria,
      articulo:it.articulo||'',medida:deriveSizeLabel(it),
      cantidad:it.cantidad,motivo:'Referencia eliminada del inventario'});
    await persistBajas();
  }
  INVENTARIO.splice(idx,1); await persistInv();
  closeModal();
  if(state.view==='size'&&!INVENTARIO.some(i=>i.categoria===state.categoria&&deriveSizeLabel(i)===state.sizeKey))
    state.view=isTipoGrouped(state.categoria)?'tipo':'categoria';
  render(); toast('Referencia eliminada');
}

function perfilDe(cat){ return PERFIL_POR_CAT[cat]||(catCfg(cat).grupo==='Herramienta manual'?'manual':'generico'); }

function parseMedida(s){
  s=String(s==null?'':s).trim(); let decimal=null,mm=null,range=false,m;
  if((m=s.match(/^(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)\s*mm$/i))){ mm=parseFloat(m[1]); decimal=mm/25.4; range=true; }   // rango de boquilla: 3-2 mm
  else if((m=s.match(/^(\d+)\s+(\d+)\/(\d+)\s*(?:"|in)?$/i))){ decimal=parseInt(m[1])+parseInt(m[2])/parseInt(m[3]); mm=+(decimal*25.4).toFixed(3); } // 1 1/4"
  else if((m=s.match(/(\d+)\/(\d+)/))){ decimal=parseInt(m[1])/parseInt(m[2]); mm=+(decimal*25.4).toFixed(3); }
  else if((m=s.match(/(\d+(?:\.\d+)?)\s*mm/i))){ mm=parseFloat(m[1]); decimal=mm/25.4; }
  else if((m=s.match(/^(\d*\.?\d+)\s*(?:"|in)$/i))){ decimal=parseFloat(m[1]); mm=+(decimal*25.4).toFixed(3); }   // 0.75"
  else if((m=s.match(/^M\s*(\d+(?:\.\d+)?)/i))){ mm=parseFloat(m[1]); decimal=mm/25.4; }
  return {display:s,decimal,mm,range};
}
/* Simbología automática: detecta la unidad y agrega ", / o mm según corresponda.
   hint = pestaña activa ('in' | 'mm'). Una fracción o comillas fuerzan pulgadas; "mm" fuerza milímetros. */
function normalizeMedida(raw,hint){
  let s=String(raw==null?'':raw).trim().replace(/[”“″]/g,'"').replace(/,/g,'.');
  if(!s) return '';
  const rng=s.match(/^(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)\s*(mm)?$/i);
  if(rng&&(rng[3]||hint==='mm')) return rng[1]+'-'+rng[2]+' mm';
  const isMm=/mm\s*$/i.test(s);
  const isIn=/"|\bin\b|pulg/i.test(s)||/\d\s*\/\s*\d/.test(s);
  const unit=isMm?'mm':(isIn?'in':hint);
  const core=s.replace(/mm|pulg\w*|\bin\b|"/ig,'').replace(/\s+/g,' ').trim();
  if(!core) return '';
  if(unit==='mm'){ const n=parseFloat(core); return isNaN(n)?s:n+' mm'; }
  return core.replace(/\s*\/\s*/g,'/')+'"';
}
function fmtOtro(el,hint){ el.value=normalizeMedida(el.value,hint); onMedidaChange(); }

function cuerpoCampos(cat,it){

/* Limas de joyero: piezas faltantes del paquete */
function actualizarCalc(){
  const b=document.getElementById('calc_faltantes'); if(!b) return;
  const tEl=document.getElementById('f_piezasEmpaque'), eEl=document.getElementById('f_cantidad');
  if(!tEl||tEl.value===''){ b.innerHTML='<span class="conv-label">Faltantes:</span> <strong>—</strong>'; return; }
  const fal=Number(tEl.value)-(eEl&&eEl.value!==''?Number(eEl.value):0);
  b.innerHTML=fal<0?'<strong style="color:var(--danger)">⚠ La existencia supera las piezas del paquete</strong>'
    :`<span class="conv-label">Faltantes:</span> <strong>${fal} pz faltantes</strong>`;
}
function leerMedida(f,edit){
  if(f.t==='mtxt'||!document.getElementById('tabIn')) return parseMedida((document.getElementById('f_'+f.k)||{value:''}).value);
  if(document.getElementById('tabIn').classList.contains('active')){
    const sv=document.getElementById('niMedidaIn').value;
    return parseMedida(/^otros$/i.test(sv)?normalizeMedida(document.getElementById('niMedidaInOtro').value,'in'):sv);
  }
  return parseMedida(normalizeMedida(document.getElementById('niMedidaMm').value,'mm'));
}
function recolectar(cat,edit){
  const out={}; let err=null;
  camposDe(cat,edit).forEach(f=>{
    if(!campoVisible(f)){ out[f.k]=undefined; return; }
    if(f.t==='medida'||f.t==='mtxt'){
      const m=leerMedida(f,edit); if(f.req&&!m.display&&!err) err='Falta: '+f.label; out.diametro=m; return;
    }
    const el=document.getElementById('f_'+f.k); if(!el) return;
    let v=el.value.trim();
    if(f.t==='sel'&&/^otros?$/i.test(v)){ const o=document.getElementById('f_'+f.k+'_otro'); v=o?o.value.trim():''; if(!v&&!err) err='Especifica: '+f.label; }
    if(f.t==='num'||f.t==='vu'){ v=v===''?undefined:Number(v); if(f.k==='cantidad') v=v||0; }
    if(f.req&&(v===''||v===undefined)&&!err) err='Falta: '+f.label;
    out[f.k]=(v===''?undefined:v);
  });
  if(cat==='limas_joyero'&&!err&&out.piezasEmpaque!=null&&(out.cantidad||0)>out.piezasEmpaque) err='La existencia no puede ser mayor que las piezas del paquete';
  return {out,err};
}
function nombreAuto(cat,r){
  if(NOMBRE_FIJO[cat]) return NOMBRE_FIJO[cat];      // Puntas de indicador, Flexómetro, Soluble / Consumible
  if(r.articulo) return r.articulo;
  const p=perfilDe(cat), med=r.diametro&&r.diametro.display?r.diametro.display:'';
  if(p==='inserto') return ['Inserto',r.codigo].filter(Boolean).join(' ');
  if(cat==='refacciones') return r.tipoRefaccion||'Refacción';
  if(cat==='pericas') return r.tipoPerica||'Pinzas / Pericas';
  let base=(cat==='cortadores'&&r.tipoHerramienta)?'Cortador '+r.tipoHerramienta:(CAT_SINGULAR[cat]||catCfg(cat).label);
  const tk=TIPO_KEY[cat]; if(tk&&r[tk]) base+=' · '+r[tk];
  const conMM=r.diametro&&r.diametro.mm&&!r.diametro.range&&(/\d+\/\d+/.test(med)||/"$/.test(med));
  const size=med?(conMM?`${med} (${r.diametro.mm} mm)`:med):'';
  const ang=(p==='avellanador'&&r.angulo)?r.angulo+'°':'';
  return [base,ang,size].filter(Boolean).join(' ');
}
function actualizarPreview(){
  const catEl=document.getElementById('niCat'), pv=document.getElementById('niNamePrev'); if(!catEl||!pv) return;
  const cat=catEl.value, {out}=recolectar(cat,false); const n=nombreAuto(cat,out);
  const needsMed=camposDe(cat,false).some(f=>f.t==='medida'||f.t==='mtxt')||perfilDe(cat)==='inserto';
  const hasMed=!!(out.diametro&&out.diametro.display)||!!out.codigo;
  const ok=n&&!out.articulo&&(needsMed?hasMed:true);
  pv.style.display=ok?'':'none';
  if(ok) pv.innerHTML=`<span class="pv-label">Se guardará como:</span> <strong>${escHtml(n)}</strong>`;
}

async function submitEdit(id){
  const it=INVENTARIO.find(i=>i.id===id); if(!it) return;
  const {out,err}=recolectar(it.categoria,true);
  if(err){ toast(err,true); return; }
  const previo=it.articulo;
  const eraAuto=previo===nombreAuto(it.categoria,{...it,articulo:undefined});   // nombre generado automáticamente
  Object.keys(out).forEach(k=>{ if(out[k]===undefined) delete it[k]; else it[k]=out[k]; });
  if(eraAuto&&it.articulo===previo) it.articulo=nombreAuto(it.categoria,{...it,articulo:undefined});   // lo mantiene al día si cambia medida/tipo
  if(!it.articulo) it.articulo=previo||nombreAuto(it.categoria,out);
  await persistInv(); closeModal(); render(); toast('Herramienta actualizada');
}

async function buildWb(title,subtitle,headers,rows,accent){
  const wb=new ExcelJS.Workbook(); wb.creator='AGSA';
  const ws=wb.addWorksheet('Datos',{views:[{state:'frozen',ySplit:4}]});
  ws.mergeCells(1,1,1,headers.length);
  const tc=ws.getCell(1,1); tc.value=title;
  tc.font={name:'Calibri',size:15,bold:true,color:{argb:'FF1F2226'}}; ws.getRow(1).height=26;
  ws.mergeCells(2,1,2,headers.length);
  const sc=ws.getCell(2,1); sc.value=subtitle;
  sc.font={name:'Calibri',size:9,italic:true,color:{argb:'FF6D747B'}}; ws.getRow(2).height=18;
  ws.addRow([]);
  const hr=ws.addRow(headers);
  hr.eachCell(c=>{ c.font={bold:true,color:{argb:'FFFFFFFF'},size:10}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:accent||'FF1F2226'}}; c.alignment={vertical:'middle',horizontal:'center'}; c.border={bottom:{style:'thin'}}; }); hr.height=22;
  rows.forEach((r,i)=>{
    const row=ws.addRow(r); const even=i%2===0;
    row.eachCell(c=>{ c.alignment={vertical:'middle'}; c.font={size:9.5,color:{argb:'FF1A1F24'}}; c.border={bottom:{style:'hair',color:{argb:'FFE0E0DD'}}};
      if(even) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF5F5F3'}}; });
  });
  headers.forEach((_,i)=>{ let max=String(headers[i]).length; rows.forEach(r=>{ const v=r[i]; if(v!=null&&v!=='') max=Math.max(max,String(v).length); }); ws.getColumn(i+1).width=Math.min(Math.max(max+3,11),38); });
  ws.autoFilter={from:{row:4,column:1},to:{row:4,column:headers.length}};
  return wb;
}
async function dlWb(wb,name){ const buf=await wb.xlsx.writeBuffer(); const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); }

async function submitImport(){
  const f=document.getElementById('importFile').files[0]; if(!f){ toast('Selecciona un archivo',true); return; }
  try{
    const buf=await f.arrayBuffer(); const wb=XLSX.read(buf,{type:'array'});

    const rows=XLSX.utils.sheet_to_json(sheet,{defval:''});
    const items=rows.map(row=>{
      const g=k=>{ for(const rk of Object.keys(row)){ if(rk.trim().toLowerCase()===k.toLowerCase()) return row[rk]; } return ''; };
      const catRaw=String(g('Categoría')||g('categoria')||'').toLowerCase().trim();
      let cat=catRaw;
      const mk=findCatKey(catRaw);
      if(mk) cat=mk; else if(!cat) cat='otros';
      const med=String(g('Medida')||g('medida')||'').trim();
      let decimal=null,mm=null;
      const frac=med.match(/(\d+)\/(\d+)/); const mmt=med.match(/(\d+(?:\.\d+)?)\s*mm/i);
      if(frac){decimal=parseInt(frac[1])/parseInt(frac[2]);mm=+(decimal*25.4).toFixed(3);}
      else if(mmt){mm=parseFloat(mmt[1]);decimal=mm/25.4;}
      const tipo=String(g('Tipo')||g('tipo')||'').trim();
      const vidaUtilRaw=g('Vida útil %')||g('vidaUtil')||g('Vida util %')||'';
      return {
        id:genId('itm'),categoria:cat,
        articulo:String(g('Artículo')||g('articulo')||'').trim(),
        tipoHerramienta:tipo||undefined,
        ubicacion:String(g('Ubicación')||g('ubicacion')||'').trim()||undefined,
        diametro:{display:med,decimal,mm},
        largoFilo:g('Filo(mm)')||g('Largo de filo (mm)')?Number(g('Filo(mm)')||g('Largo de filo (mm)')):undefined,
        longitudTotal:g('Long.(mm)')||g('Longitud total (mm)')?Number(g('Long.(mm)')||g('Longitud total (mm)')):undefined,
        piezasEmpaque:g('Empaque')||g('Piezas por empaque')?Number(g('Empaque')||g('Piezas por empaque')):undefined,
        cantidad:Number(g('Cantidad')||g('cantidad'))||0,
        vidaUtil:vidaUtilRaw!==''?Number(vidaUtilRaw):undefined,
        notas:String(g('Notas')||g('notas')||'').trim()
      };
    }).filter(it=>it.articulo||it.categoria);
    if(!items.length){ toast('No se encontraron filas válidas',true); return; }
    INVENTARIO=items; await persistInv(); closeModal(); goHome(); toast(`Inventario importado: ${items.length} referencias`);
  }catch(e){ console.error(e); toast('No se pudo leer el archivo',true); }
}
window.submitImport=submitImport;

/* =========================================================================
   INICIO
   ========================================================================= */
(async function init(){
  await loadAll();
  render();
})();
</script>
